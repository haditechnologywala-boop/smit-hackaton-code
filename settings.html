<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCM Lite - Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 bg-dark text-white vh-100 p-3">

            <h4 class="text-center py-3">HCM Lite</h4>

            <ul class="nav flex-column">

                <li class="nav-item mb-2">
                    <a href="admin.html" class="nav-link text-white">
                        Dashboard
                    </a>
                </li>

                <li class="nav-item mb-2">
                    <a href="employees.html" class="nav-link text-white">
                        Employees
                    </a>
                </li>

                <li class="nav-item mb-2">
                    <a href="leaves.html" class="nav-link text-white">
                        Leave Requests
                    </a>
                </li>

                <li class="nav-item mb-2">
                    <a href="settings.html" class="nav-link text-white active bg-primary rounded">
                        Settings
                    </a>
                </li>

                <li class="nav-item mt-4">
                    <a href="index.html" class="nav-link text-danger">
                        Logout
                    </a>
                </li>

            </ul>

        </nav>

        <!-- Main -->
        <main class="col-md-9 col-lg-10 px-md-4 py-4">

            <h2>Settings</h2>
            <p class="text-muted">Manage your HCM Lite settings.</p>

            <div class="card shadow-sm p-4">

                <h5 class="mb-4">Admin Profile</h5>

                <form>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text"
                                   class="form-control"
                                   value="Admin User">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email"
                                   class="form-control"
                                   value="admin@hcmlite.com">
                        </div>

                    </div>

                    <div class="mb-3">
                        <label class="form-label">Company Name</label>
                        <input type="text"
                               class="form-control"
                               value="HCM Lite Company">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="tel"
                               class="form-control"
                               value="+92 300 1234567">
                    </div>

                    <hr>

                    <h5 class="mb-3">Change Password</h5>

                    <div class="mb-3">
                        <label class="form-label">Current Password</label>
                        <input type="password"
                               class="form-control"
                               placeholder="Enter current password">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password"
                               class="form-control"
                               placeholder="Enter new password">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password"
                               class="form-control"
                               placeholder="Confirm new password">
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Save Changes
                    </button>

                </form>

            </div>

        </main>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
